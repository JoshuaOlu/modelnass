# ═══════════════════════════════════════════════════════════════
# PAST SESSIONS ARCHIVE
# ───────────────────────────────────────────────────────────────
# Add new completed sessions at the TOP of this list.
# The past-sessions page renders them in the order they appear here.
#
# FIELD REFERENCE
# ───────────────────────────────────────────────────────────────
# number        Session number (e.g. 261)
# name          Full session name
# tag           Short label shown as a badge (e.g. "March 28 Emergency Session")
# date          Human-readable date (e.g. "March 28, 2026")
# delegates     Number of delegates selected
# setting       Always "Federal Republic of Mona" unless otherwise
# theme         One-line theme descriptor for the meta row
#
# description   List of paragraphs. Each item becomes a <p> block.
#
# highlights    List of short theme tags shown as pills.
#
# video_id      YouTube video ID only (the part after ?v=).
#               Leave blank ("") if no recording is available yet.
#
# report_url    Full URL to the session report (PDF, Drive link, etc.).
#               Leave blank ("") if the report is not yet published.
#
# photos        List of image paths relative to the site root.
#               Store images in /images/sessions/<number>/.
#               Leave as an empty list ([]) if no photos yet.
# ═══════════════════════════════════════════════════════════════

