number: 262
name: "The Checkmate Initiative"

# Eyebrow text in the hero (e.g. "Model National Assembly · October 2026")
eyebrow: "Model National Assembly · October 2026"

# Large italic word(s) in the hero title — displayed in gold
# Full title renders as: The <em>Checkmate</em> Initiative
title_prefix: "The"
title_highlight: "Checkmate"
title_suffix: "Initiative"

# Below the title
tagline: "Institutionalising gender equity in Monan leadership."
subtitle: "A polarising bill. A fractured chamber. 72 delegates to decide."

# Small metadata line below the divider
date_text: "Date to be announced · Registration now open"

# Delegate count shown in the final CTA badge
delegate_count: 72

# Registration link — leave blank to fall back to site.register_url in _config.yml
register_url: ""

# ── SHARE / OG META ─────────────────────────────────────────────
og_title: "Model NASS — The Checkmate Initiative"
og_description: "Institutionalising gender equity in Monan leadership. A polarising bill. A fractured assembly. 72 delegates to decide."
og_image: "/images/share-preview-v2.png"

# ── THE BILL / SESSION BRIEF ────────────────────────────────────
# The section below the hero explaining what the session is about.
brief_heading: "The Gender Equity in Leadership Act has arrived on the floor."

# Each item becomes a paragraph. Add or remove paragraphs as needed.
brief_body:
  - "The bill proposes mandatory gender equity targets across every sector of Monan society — from government ministries and state agencies to private companies with government contracts, and including religious organisations. Proponents call it a historic correction. Critics call it overreach."
  - "For the first time, the chamber must answer a question that has divided Mona for a generation: <strong style=\"color: #fff;\">Who decides who leads?</strong>"

# ── FACTIONS / FAULT LINES ─────────────────────────────────────
# The three (or two, or four) fault-line cards on the dark green section.
# Remove a block entirely to show fewer cards.
factions:
  - label: "The Reformers"
    text: "Decades of documented exclusion demand a structural response. Voluntary targets have failed. The time for legislation is now."
  - label: "The Traditionalists"
    text: "Forcing equity by quota undermines merit and violates the autonomy of faith communities and private institutions alike."
  - label: "The Pragmatists"
    text: "The bill's ambition is right but its reach is too broad. What amendments could make it pass — and what would that cost?"

# ── PULL QUOTE ──────────────────────────────────────────────────
# Optional. Remove this block entirely (or leave text blank) to hide the quote section.
quote:
  text: "The simulation is not preparation for the real thing. It is the real thing — just in a room where you're allowed to be wrong."
  attribution: "— The Team, March 28 Emergency Session"

# ── WHO IT'S FOR CARDS ──────────────────────────────────────────
# The four audience cards. You can update the emoji and text per session.
audience:
  - icon: "⚖️"
    text: "Interested in law, policy, or governance"
  - icon: "🗣️"
    text: "Strong in debate, negotiation, or persuasion"
  - icon: "📚"
    text: "Research-minded, curious about social systems"
  - icon: "🌍"
    text: "Passionate about equity, inclusion, and civic life"

# ── FINAL CTA ───────────────────────────────────────────────────
cta_heading: "The move is yours."
cta_body: "The session date will be announced soon. Register your interest now so you don't miss the call."
