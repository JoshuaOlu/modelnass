# WORKFLOW SUMMARY
# ───────────────────────────────────────────────────────────────
# Starting a new recruitment cycle:
#   1. Update all fields below for the new session
#   2. Set status: "recruiting"
#   3. Replace the og_image with the new session artwork
#
# Applications close, session approaching:
#   1. Set status: "upcoming"
#   2. Update date_text to the confirmed date and venue
#
# Session just ended:
#   1. Add the completed session to _data/sessions.yml (top of list)
#   2. Set status: "just_happened"
#   (homepage auto-pulls the name and description from sessions.yml)
#
# Nothing imminent, holding between cycles:
#   1. Set status: "between"
#
# STATUS OPTIONS: recruiting | upcoming | just_happened | between
# ═══════════════════════════════════════════════════════════════

